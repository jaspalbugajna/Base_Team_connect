<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Base Team Connect</title>
    <style>
        body { background: #0052ff; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(4, 100px); gap: 15px; margin-top: 20px; }
        .card { width: 100px; height: 100px; background: #0022aa; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; cursor: pointer; user-select: none; border-radius: 8px; text-align: center; padding: 5px; box-sizing: border-box; }
        .card.flipped, .card.matched { background: white; color: #0052ff; }
    </style>
</head>
<body>
    <h1>Base Connect Memory</h1>
    <p>Найдите пары крипто-терминов!</p>
    <div class="grid" id="grid"></div>
    <script>
        const words = ['Base', 'Layer 2', 'Ethereum', 'Smart Contract', 'Optimism', 'Wallet', 'Base', 'Layer 2', 'Ethereum', 'Smart Contract', 'Optimism', 'Wallet'];
        let shuffled = words.sort(() => 0.5 - Math.random());
        let flippedCards = [], matchedCount = 0;
        const grid = document.getElementById('grid');

        shuffled.forEach((word, index) => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.word = word;
            card.innerText = '?';
            card.addEventListener('click', () => {
                if (card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) return;
                card.classList.add('flipped');
                card.innerText = card.dataset.word;
                flippedCards.push(card);
                if (flippedCards.length === 2) setTimeout(checkMatch, 600);
            });
            grid.appendChild(card);
        });

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (card1.dataset.word === card2.dataset.word) {
                card1.classList.add('matched'); card2.classList.add('matched');
                matchedCount += 2;
                if (matchedCount === words.length) setTimeout(() => alert('Победа! Все пары найдены!'), 300);
            } else {
                card1.classList.remove('flipped'); card1.innerText = '?';
                card2.classList.remove('flipped'); card2.innerText = '?';
            }
            flippedCards = [];
        }
    </script>
</body>
</html>
